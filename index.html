<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 12px;
            margin: 0;
        }
        h2 { text-align: center; }
        .product-card {
            border: 1px solid var(--tg-theme-hint-color, #ddd);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            background-color: var(--tg-theme-secondary-bg-color, #f9f9f9);
        }
        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }
        .product-title { margin: 10px 0 5px; font-size: 16px; }
        .product-price { font-weight: bold; color: #2e7d32; margin-bottom: 10px; }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Каталог товаров</h2>
    <div id="catalog"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ⚠️ ЗАМЕНИ НА ЮЗЕРНЕЙМ ТВОЕГО МЕНЕДЖЕРА (БЕЗ СОБАЧКИ @)
        const MANAGER_USERNAME = "manager_AVTO_TUN";

        // Массив товаров
        const products = [
            {
                id: 1,
                name: "Решетка радиатора ВАЗ 2114",
                price: "1 500 ₽",
                image: "https://via.placeholder.com/300x200?text=Товар+1"
            },
            {
                id: 2,
                name: "Фары противотуманные (ПТФ)",
                price: "2 300 ₽",
                image: "https://via.placeholder.com/300x200?text=Товар+2"
            }
        ];

        const container = document.getElementById('catalog');

        products.forEach(item => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${item.image}" class="product-img">
                <div class="product-title">${item.name}</div>
                <div class="product-price">${item.price}</div>
                <button onclick="orderProduct('${item.name}')">Купить / Написать менеджеру</button>
            `;
            container.appendChild(card);
        });

        function orderProduct(title) {
            const msg = encodeURIComponent(`Здравствуйте! Меня интересует товар: "${title}". Расскажите про наличие.`);
            tg.openTelegramLink(`https://t.me/${MANAGER_USERNAME}?text=${msg}`);
        }
    </script>
</body>
</html>
